<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Clickable Layout</title>
    <style>
        /* BASE PAGE STYLES */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
        }

        /* 1. THE FIXED BACKGROUND LAYER */
        /* This layer stays behind and lets all clicks pass through it */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #34495e;
            opacity: 0.1; /* Light overlay for visualization */
            
            /* CRITICAL FIXES FOR BACKGROUND */
            z-index: 1 !important;         /* Keeps it on a low layer */
            pointer-events: none !important; /* Clicks pass right through this */
        }

        /* 2. THE FIXED CONTENT CONTAINER */
        /* This holds your active page content on a higher layer */
        .content-layer {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            
            /* CRITICAL FIXES FOR CONTENT CONTAINER */
            z-index: 1000 !important;      /* Lifts content above background */
        }

        /* 3. THE FIXED BUTTON STYLES */
        /* These settings force the buttons to accept clicks on the top layer */
        .clickable-btn, button, a {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            
            /* CRITICAL FIXES FOR BUTTONS */
            position: relative !important; 
            z-index: 9999 !important;      /* Puts buttons on the absolute top layer */
            pointer-events: auto !important; /* Guarantees they register clicks */
            cursor: pointer !important;      /* Forces the hand cursor to show */
        }

        /* Visual hover state to prove it is working */
        .clickable-btn:hover, button:hover, a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- BACKGROUND ELEMENT (Will not block anything) -->
    <div class="background-container"></div>

    <!-- MAIN CONTENT LAYER (Contains your interactive elements) -->
    <div class="content-layer">
        <h1>Your Web Page Title</h1>
        <p>The background can move or resize freely without blocking the items below.</p>
        
        <!-- BUTTON EXAMPLES USING THE NEW FIXED LAYER CLASSES -->
        <button onclick="testClick('Standard Button')">Standard Button</button>
        <a href="javascript:void(0);" class="clickable-btn" onclick="testClick('Link Button')">Text Link Button</a>
    </div>

    <!-- JAVASCRIPT TEST ACTION -->
    <script>
        function testClick(buttonName) {
            alert(buttonName + " is working perfectly!");
        }
    </script>

</body>
</html>
