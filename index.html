<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: screenGlitchShake 8s infinite linear;
            transition: animation 0.3s ease;
        }
        .app-container.video-playing {
            animation: none !important;
        }
        
        /* --- 1. MOBILE PHONE BACKGROUND (DEFAULT) --- */
        .wallpaper-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center -144px;
            z-index: 5;
            pointer-events: none; 
            user-select: none;
            -webkit-user-drag: none;
            content: url('reflexiunnewwallpaper.png');
            transition: opacity 0.5s ease;
        }
        .wallpaper-bg.fade-out {
            opacity: 0;
        }

        /* --- HARDWARE VIDEO TRACK LAYERS --- */
        .video-player-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 4; 
            background-color: #000;
            display: none;
        }

        /* --- HARDWARE LIVE CAMERA MIRROR LAYER --- */
        .camera-feed-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transform: scaleX(-1);
            background-color: #000;
            display: none;
            transition: opacity 2s linear; /* Smooth 2-second fade driver */
        }
        .matrix-filter-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            display: none;
            mix-blend-mode: screen; /* Drops black background, blends matrix onto user's face */
            pointer-events: none;
            transition: opacity 2s linear; /* Smooth 2-second fade driver */
        }
        
        .nav-menu-stack {
            position: relative;
            z-index: 10; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding-top: 210px;
            gap: 24px;
            pointer-events: auto;
            transition: opacity 0.5s ease;
        }
        .nav-menu-stack.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        
        /* --- 2. TABLET / IPAD DEVICE OVERRIDES --- */
        @media (min-width: 600px) and (max-width: 1023px) {
            .wallpaper-bg {
                content: url('reflexiuntablet.png'); 
                object-fit: contain;
                width: 100%;
                height: 100%;
                object-position: center center;
                margin-top: -30px; 
            }
            .nav-menu-stack {
                padding-top: 250px; 
            }
        }
        
        /* --- 3. DESKTOP / LAPTOP MONITOR OVERRIDES --- */
        @media (min-width: 1024px) {
            .wallpaper-bg {
                content: url('reflexiundesktop.png'); 
                object-fit: contain;
                width: 100%;
                height: 100%;
                max-width: 100vw;
                max-height: 100vh;
                object-position: center center;
                margin-top: -40px; 
            }
            .nav-menu-stack {
                padding-top: 310px; 
            }
        }

        .enter-link, .download-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer;
            font-weight: 400;
            display: inline-block;
            padding: 10px 20px;
            background: none;
            border: none;
            outline: none;
        }

        /* --- THE MIRROR DESIGN EFFECT --- */
        .mirror-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .mirror-reflection {
            transform: scaleY(-1);
            opacity: 0.07; 
            margin-top: -18px; 
            filter: blur(2px); 
            user-select: none;
            pointer-events: none;
        }

        @keyframes screenGlitchShake {
            0%, 92%, 100% { transform: translate(0, 0); }
            93% { transform: translate(-3px, 2px); }
            94% { transform: translate(2px, -2px); }
            95% { transform: translate(-2px, 3px); }
            96% { transform: translate(3px, -1px); }
            97% { transform: translate(0, 0); }
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.25; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            15% { opacity: 1; text-shadow: 0 0 16px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.9); }
            22% { opacity: 0.35; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
            45% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 35px rgba(255,255,255,0.8); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 12px rgba(255,255,255,0.7); }
            85% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- Live Mirror Track -->
        <video id="cameraStream" class="camera-feed-stream" autoplay playsinline muted></video>

        <!-- Matrix Matrix Code Overlay Filter -->
        <video id="matrixFilter" class="matrix-filter-layer" autoplay playsinline muted loop></video>

        <!-- Production Master Movie Layer -->
        <video id="transitionVideo" class="video-player-layer" playsinline webkit-playsinline></video>

        <!-- Static Artwork Layer -->
        <img class="wallpaper-bg" id="wallpaperBg" alt="Reflexiun Adaptive Framework">
        
        <div class="nav-menu-stack" id="navMenuStack">
            <a href="javascript:void(0);" id="dropInTrigger" class="enter-link">drop in</a>
            
            <div class="mirror-block">
                <a href="#" id="dynamicDownload" class="download-btn" download>reflect</a>
                <span class="download-btn mirror-reflection">reflect</span>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DYNAMIC DEVICE DOWNLOAD ENGINE ---
        function configureAdaptiveDownload() {
            const downloadLink = document.getElementById('dynamicDownload');
            if (!downloadLink) return;

            const width = window.innerWidth;
            let targetFile = 'reflexiunnewwallpaper.png'; 

            if (width >= 1024) {
                targetFile = 'reflexiundesktop.png'; 
            } else if (width >= 600) {
                targetFile = 'reflexiuntablet.png'; 
            }

            downloadLink.href = targetFile;
        }

        window.addEventListener('DOMContentLoaded', configureAdaptiveDownload);
        window.addEventListener('resize', configureAdaptiveDownload);

        // --- 2. MULTI-TIER AUTOMATED MOVIE SEQUENCER ---
        const dropInTrigger = document.getElementById('dropInTrigger');
        const transitionVideo = document.getElementById('transitionVideo');
        const cameraVideo = document.getElementById('cameraStream');
        const matrixFilter = document.getElementById('matrixFilter');
        const wallpaperBg = document.getElementById('wallpaperBg');
        const navMenuStack = document.getElementById('navMenuStack');
        const appContainer = document.getElementById('appContainer');
        
        let localCameraStream = null;

        dropInTrigger.addEventListener('click', async () => {
            // Stage matrix resource code loop cleanly ahead of track handoff
            matrixFilter.src = 'phonecode.mp4';
            matrixFilter.load();

            // Pre-warm and authorize live hardware channels silently
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    localCameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "user" },
                        audio: false
                    });
                    cameraVideo.srcObject = localCameraStream;
                } catch (cameraErr) {
                    console.warn("Camera streaming pipeline unavailable or denied:", cameraErr);
                }
            }

            // Set up original starting intro video track
            transitionVideo.src = 'introvideo.mp4';
            
            // Dissolve interface container structures
            navMenuStack.classList.add('fade-out');
            wallpaperBg.classList.add('fade-out');
            appContainer.classList.add('video-playing');

            // Force visibility channels and execute master playback
            transitionVideo.style.display = 'block';
