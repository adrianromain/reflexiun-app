<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        /* Pure code glowing logo graphic */
        .logo-graphic {
            width: 120px;
            height: 120px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-inner {
            width: 40px;
            height: 40px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
        .enter-link {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: randomGlow 4s infinite ease-in-out;
            cursor: pointer;
            margin-top: 10px;
        }
        @keyframes randomGlow {
            0%, 100% { opacity: 0.3; text-shadow: 0 0 2px rgba(255,255,255,0.2); }
            15% { opacity: 1; text-shadow: 0 0 12px rgba(255,255,255,1), 0 0 20px rgba(255,255,255,0.8); }
            20% { opacity: 0.4; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            45% { opacity: 0.9; text-shadow: 0 0 15px rgba(255,255,255,1); }
            50% { opacity: 0.2; text-shadow: none; }
            65% { opacity: 0.8; text-shadow: 0 0 10px rgba(255,255,255,0.7); }
            85% { opacity: 1; text-shadow: 0 0 14px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo built directly out of code elements -->
        <div class="logo-graphic">
            <div class="logo-inner"></div>
        </div>
        <a href="#content" class="enter-link">drop in</a>
    </div>

</body>
</html>
