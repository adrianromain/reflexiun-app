<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        /* WALLPAPER BASE CONTAINER */
        .media-vault {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000;
            z-index: 1 !important;
            pointer-events: none !important;
            user-select: none;
        }
        
        /* STATIC WALLPAPER FRAMES */
        .phone-bg, .tablet-bg, .desktop-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            z-index: 2 !important; 
            pointer-events: none !important; 
            transition: opacity 0.5s ease;
            display: none;
        }

        @media (max-width: 599px) {
            .phone-bg {
                display: block;
                background-image: url('reflexiunnewwallpaper.png');
                background-position: center center;
                transform: scale(1.1) translateY(-40px);
            }
            .enter-link, .download-btn { font-size: 0.55rem !important; padding: 0px !important; }
            .mirror-block { height: 24px !important; }
            .mirror-block .mirror-reflection { margin-top: -6px !important; }
            .nav-menu-stack { gap: 12px !important; }
        }

        @media (min-width: 600px) and (max-width: 1023px) {
            .tablet-bg { display: block; background-image: url('reflexiunnewwallpaper.png'); background-position: center center; }
        }

        @media (min-width: 1024px) {
            .desktop-bg { display: block; background-image: url('reflexiunnewwallpaper.png'); background-position: center center; }
        }
        
        /* CINEMATIC VIDEO BACKGROUND LAYER */
        .movie-track-node {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
            display: none;
            z-index: 5 !important;
            pointer-events: none !important; 
        }

        /* LIVE FRONT-FACING MIRROR LENS RE-ROUTED BELOW THE FRAME OVERLAY */
        #cameraMirror {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 10 !important; /* Positioned directly underneath your framework overlay layer */
            transform: scaleX(-1);   /* Keeps the natural mirror perspective intact */
            pointer-events: none !important;
        }

        /* ACTIVE MATRIX FILTER WRAPPER CONTAINER */
        #phoneOverlayFilter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.35); /* Soft industrial tint matrix overlay */
            display: none;
            z-index: 20 !important; /* Stays locked right on top of their live face view */
            pointer-events: none !important;
        }
        
        /* CONTROL INTERACTION STACK */
        .nav-menu-stack {
            position: fixed !important; 
            bottom: 12%;

            transform: translateX(-50%);
