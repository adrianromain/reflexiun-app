<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { background-color: #000; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        .media-vault { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: #000; z-index: 1 !important; pointer-events: none !important; user-select: none; }
        
        .wallpaper-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center center; z-index: 2 !important; pointer-events: none !important; transition: opacity 0.5s ease; }
        @media (max-width: 599px) { .wallpaper-bg { background-image: url('reflexiunphone.png'); } }
        @media (min-width: 600px) and (max-width: 1023px) { .wallpaper-bg { background-image: url('reflexiuntablet.png'); } }
        @media (min-width: 1024px) { .wallpaper-bg { background-image: url('reflexiundesktop.png'); } }
        
        /* Base video styles */
        .movie-track-node { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; background-color: #000; opacity: 0; z-index: 4 !important; 
            pointer-events: none !important; transition: opacity 0.3s ease; 
        }

        /* The filter: Using contain and scale to keep the full video visible */
        .practice-filter {
            object-fit: contain !important;
            transform: scale(0.9);
            mix-blend-mode: screen; 
            filter: brightness(0.6) contrast(1.2);
            transition: filter 1s ease, opacity 1s ease;
        }
        
        /* Camera set to Z-index 3 to sit behind the video filter */
        #cameraStreamNode { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; 
            transform: scaleX(-1); -webkit-transform: scaleX(-1); z-index: 3 !important; opacity: 0; 
            transition: opacity 0.8s ease; 
            filter: grayscale(1) contrast(1.4) brightness(0.8) blur(1.5px);
        }
        
        .nav-menu-stack { position: fixed !important; bottom: 18%; left: 50%; transform: translateX(-50%); z-index: 999999 !important; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; width: 100%; max-width: 600px; gap: 24px; pointer-events: auto !important; }
        @media (min-width: 600px) and (max-width: 1023px) { .nav-menu-stack { bottom: 20%; gap: 32px; } }
        @media (min-width: 1024px) { .nav-menu-stack { bottom: calc(22% + 32px); gap: 48px; } }

        .btn-container { display: flex; flex-direction: column; align-items: center; pointer-events: auto !important; }
        
        .enter-link, .download-btn { 
            color: #fff; text-decoration: none; letter-spacing: 5px; text-transform: uppercase; 
            cursor: pointer; font-weight: 300 !important; display: inline-block !important; 
            padding: 4px 16px; background: none; border: none; outline: none; 
            white-space: nowrap; animation: pulseOpacity 3.5s infinite ease-in-out; 
        }

        .mirror-reflection { 
            color: #fff; letter-spacing: 5px; text-transform: uppercase; font-weight: 300 !important;
            transform: scaleY(-1); opacity: 0.45; margin-top: -6px; user-select: none; pointer-events: none !important;
            filter: blur(0.4px); text-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        @media (max-width: 599px) { .enter-link, .download-btn, .mirror-reflection { font-size: 0.55rem; } }
        @media (min-width: 600px) and (max-width: 1023px) { .enter-link, .download-btn, .mirror-reflection { font-size: 1.1rem; } }
        @media (min-width: 1024px) { .enter-link, .download-btn, .mirror-reflection { font-size: 1.1rem; } }

        @keyframes pulseOpacity {
            0%, 100% { opacity: 0.6; }
            15% { opacity: 1; }
            50% { opacity: 0.4; }
            85% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="media-vault">
        <div class="wallpaper-bg" id="wallpaperBg"></div>
        <video id="cameraStreamNode" autoplay muted playsinline></video>
        <video id="masterVideoEngine" class="movie-track-node" playsinline webkit-playsinline preload="auto"></video>
    </div>

    <div class="nav-menu-stack" id="navMenuStack">
        <div class="btn-container">
            <button id="dropInTrigger" class="enter-link">drop in</button>
            <span class="mirror-reflection">drop in</span>
        </div>
        <div class="btn-container">
            <button id="mirrorTrigger" class="enter-link">look in the mirror</button>
            <span class="mirror-reflection">look in the mirror</span>
        </div>
        <div class="btn-container">
            <button id="practiceTrigger" class="enter-link">the practice</button>
            <span class="mirror-reflection">the practice</span>
        </div>
        <div class="btn-container">
            <a href="reflexiunphone.png" id="dynamicDownload" class="download-btn" download>reflect</a>
            <span class="mirror-reflection">reflect</span>
        </div>
    </div>

    <script>
        function configureAdaptiveDownload() {
            const downloadLink = document.getElementById('dynamicDownload');
            if (!downloadLink) return;
            const width = window.innerWidth;
            let targetFile = 'reflexiunphone.png'; 
            if (width >= 1024) { targetFile = 'reflexiundesktop.png'; } 
            else if (width >= 600) { targetFile = 'reflexiuntablet.png'; }
            downloadLink.href = targetFile;
        }
        window.addEventListener('DOMContentLoaded', configureAdaptiveDownload);
        window.addEventListener('resize', configureAdaptiveDownload);

        const dropInTrigger = document.getElementById('dropInTrigger');
        const mirrorTrigger = document.getElementById('mirrorTrigger');
        const practiceTrigger = document.getElementById('practiceTrigger');
        const masterVideo = document.getElementById('masterVideoEngine');
        const cam = document.getElementById('cameraStreamNode');
        const wallpaperBg = document.getElementById('wallpaperBg');
        const navMenuStack = document.getElementById('navMenuStack');

        let selectedPathwayRoute = "dropin";
        let flowState = "intro"; 
        const localIntroUrl = "introvideo.mp4";
        const localDropInUrl = "dropinvid.mp4";
        const localMirrorUrl = "lookinthemirror.mp4";
        const localPracticeUrl = "thepractice.mp4";

        function startStreamingVideo(routeName) {
            selectedPathwayRoute = routeName;
            flowState = "intro";
            masterVideo.classList.remove('practice-filter'); 
            navMenuStack.style.opacity = '0';
            navMenuStack.style.pointerEvents = 'none';
            wallpaperBg.style.opacity = '0';
            masterVideo.src = localIntroUrl;
            masterVideo.style.opacity = '1'; 
            masterVideo.play();
        }
        
        dropInTrigger.addEventListener('click', () => startStreamingVideo("dropin"));
        mirrorTrigger.addEventListener('click', () => startStreamingVideo("mirror"));
        practiceTrigger.addEventListener('click', () => startStreamingVideo("practice"));

        // Monitor video time for fade-out effect
        masterVideo.addEventListener('timeupdate', () => {
            if (flowState === "camera_active" && masterVideo.duration - masterVideo.currentTime <= 5) {
                masterVideo.style.opacity = '0.3'; // Gently fade the video filter
            }
        });

        masterVideo.addEventListener('ended', () => {
            if (flowState === "intro") {
                if (selectedPathwayRoute === "practice") {
                    flowState = "camera_active";
                    masterVideo.classList.add('practice-filter');
                    masterVideo.style.opacity = '1'; // Reset opacity
                    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                        cam.srcObject = stream;
                        cam.style.opacity = '1';
                        masterVideo.src = localPracticeUrl;
                        masterVideo.play();
                    });
                } else {
                    flowState = "final";
                    const videoMap = {
                        "mirror": localMirrorUrl,
                        "dropin": localDropInUrl
                    };
                    masterVideo.src = videoMap[selectedPathwayRoute] || localDropInUrl;
                    masterVideo.play();
                }
            } else if (flowState === "camera_active" || flowState === "final") {
                if (cam.srcObject) {
                    cam.srcObject.getTracks().forEach(t => t.stop());
                    cam.srcObject = null;
                }
                cam.style.opacity = '0';
                masterVideo.style.opacity = '0';
                masterVideo.classList.remove('practice-filter'); 
                navMenuStack.style.opacity = '1';
                navMenuStack.style.pointerEvents = 'auto';
                wallpaperBg.style.opacity = '1';
                flowState = "intro";
            }
        });
    </script>
</body>
</html>
