<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        /* Uses clean vertical grid boxes to prevent layout overlap */
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            padding: 40px 20px;
        }
        /* Centers your graphic naturally while preventing cropping issues */
        .graphic-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        .wallpaper-bg {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            /* Lifts the logo artwork slightly higher across all displays */
            transform: translateY(-40px); 
        }
        /* Places the link box firmly at the bottom of the device viewport */
        .content-overlay {
            margin-top: auto;
            margin-bottom: 40px;
            text-align: center;
            z-index: 2;
        }
        .enter-link {
            color: #fff;
            text-decoration: none;
            font-size: 1.25rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer;
            font-weight: 400;
            display: block;
        }
        @keyframes randomGlow {
            0%, 100% { opacity: 0.2; text-shadow: 0 0 2px rgba(255,255,255,0.2); }
            15% { opacity: 1; text-shadow: 0 0 12px rgba(255,255,255,1), 0 0 20px rgba(255,255,255,0.8); }
            22% { opacity: 0.3; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            45% { opacity: 0.85; text-shadow: 0 0 14px rgba(255,255,255,0.9); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 8px rgba(255,255,255,0.6); }
            85% { opacity: 1; text-shadow: 0 0 14px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Logo artwork container -->
        <div class="graphic-wrapper">
            <img src="reflexiunbackground.png" alt="Reflexiun Background" class="wallpaper-bg">
        </div>
        
        <!-- Bottom-anchored link button layout -->
        <div class="content-overlay">
            <a href="#content" class="enter-link">drop in</a>
        </div>
    </div>

</body>
</html>
