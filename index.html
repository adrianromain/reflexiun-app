<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        /* THE MEDIA LAYER: Forced deep into the background underneath the text buttons */
        .media-vault {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000;
            z-index: 1 !important;
            pointer-events: none !important;
            user-select: none;
        }
        
        /* MOBILE VIEWPORT ARTWORK: Fixed to preserve your exact screenshot look */
        .wallpaper-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('reflexiunnewwallpaper.png');
            background-size: cover;
            background-position: center -220px; 
            z-index: 2 !important; 
            pointer-events: none !important; 
            transition: opacity 0.5s ease;
        }
        
        /* THE IMMERSIVE WEB PLAYER STAGE: Naked viewport dynamic video engine */
        .movie-track-node {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
            display: none;
            z-index: 4 !important;
            pointer-events: none !important; 
        }
        
        /* 
           THE PEAK PLANE INDEPENDENT TRIGGER ENGINE
           Every row anchors directly to screen coordinates. Zero shared column boxes. Zero masking.
        */
        .mirror-block {
            position: fixed !important;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%; 
            max-width: 400px;
            height: auto !important;
            z-index: 999999 !important; /* Total dominance over screen layers */
            pointer-events: none !important; /* Invisible wrapper frames cannot catch touch events */
        }
        
        /* INDEPENDENT POSITION TRACKING ARRAY: Mapped perfectly to preserve your 16px layout gaps */
        #row-dropin { bottom: 22%; }
        #row-mirror { bottom: 17%; }
        #row-reflect { bottom: 12%; } /* LOCKED: Drops down exactly where it sits in your phone screenshot */
        
        @media (min-width: 600px) and (max-width: 1023px) {
            #row-dropin { bottom: 24%; }
            #row-mirror { bottom: 19%; }
            #row-reflect { bottom: 14%; }
        }
        
        /* DESKTOP MONITOR POSITION ADJUSTMENT OVERRIDES */
        @media (min-width: 1024px) {
            .wallpaper-bg { background-position: center center; }
            #row-dropin { bottom: 16% !important; }
            #row-mirror { bottom: 12% !important; }
            #row-reflect { bottom: 8% !important; } /* Lowers layout link rows on desktop monitors */
            
            .mirror-block .enter-link, 
            .mirror-block .download-btn {
                font-size: 0.95rem !important; /* Shrinks typography font scale sleeker on monitors */
            }
        }

        /* CORE TEXT ACTIONS: Isolated absolute touch targets */
        .enter-link, .download-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem; 
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer; 
            font-weight: 300 !important; 
            display: inline-block !important; 
            padding: 8px 16px; 
            background: none;
            border: none;
            outline: none;
            pointer-events: auto !important; /* Forces the browser engine to receive your clicks exclusively */
            z-index: 9999999 !important;
            position: relative;
        }
        
        /* CLEAN REFLECTION SIGNATURE ARCHITECTURE */
        .mirror-reflection {
            transform: scaleY(-1);
            opacity: 0.08; /* Exact reflection intensity signature match */
            margin-top: -18px; 
            filter: blur(3px); 
            user-select: none;
            pointer-events: none !important; /* Mirror shadows are completely transparent to mouse trackpads */
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.25; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            15% { opacity: 1; text-shadow: 0 0 16px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.9); }
            22% { opacity: 0.35; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
            45% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 35px rgba(255,255,255,0.8); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 12px rgba(255,255,255,0.7); }
            85% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- Subterranean media layout vault pushes graphic layers underneath active controls -->
        <div class="media-vault">
            <div class="wallpaper-bg" id="wallpaperBg"></div>
            <video id="masterVideoEngine" class="movie-track-node" playsinline webkit-playsinline crossorigin="anonymous" preload="auto" style="pointer-events: none !important;"></video>
        </div>

        /* 
           UNIFIED INDEPENDENT INTERACTION MATRIX 
           Each button floats completely standalone to eliminate box enclosure crashes entirely 
        */
        <!-- 1. Drop In Active Target Link -->
        <div class="mirror-block" id="row-dropin">
            <a href="javascript:void(0);" id="dropInTrigger" class="enter-link">drop in</a>
            <span class="enter-link mirror-reflection">drop in</span>
        </div>
        
        <!-- 2. Look In The Mirror Active Target Link -->
        <div class="mirror-block" id="row-mirror">
            <a href="javascript:void(0);" id="mirrorTrigger" class="enter-link">look in the mirror</a>
            <span class="enter-link mirror-reflection">look in the mirror</span>
        </div>
        
        <!-- 3. Reflect Download Target Link -->
        <div class="mirror-block" id="row-reflect">
            <a href="reflexiunnewwallpaper.png" id="dynamicDownload" class="download-btn" download>reflect</a>
            <span class="download-btn mirror-reflection">reflect</span>
        </div>
    </div>

    <script>
        function configureAdaptiveDownload() {
            const downloadLink = document.getElementById('dynamicDownload');
            if (!downloadLink) return;
            const width = window.innerWidth;
            let targetFile = 'reflexiunnewwallpaper.png'; 
            if (width >= 1024) { targetFile = 'reflexiundesktop.png'; } 
            else if (width >= 600) { targetFile = 'reflexiuntablet.png'; }
            downloadLink.href = targetFile;
        }
        window.addEventListener('DOMContentLoaded', configureAdaptiveDownload);
        window.addEventListener('resize', configureAdaptiveDownload);

        const dropInTrigger = document.getElementById('dropInTrigger');
        const mirrorTrigger = document.getElementById('mirrorTrigger');
        const masterVideo = document.getElementById('masterVideoEngine');
        const wallpaperBg = document.getElementById('wallpaperBg');

        let activeFilePlaylist = [];
        let currentPlaylistIndex = 0;

        // Relative paths clear nested folder hosted tracks on GitHub Pages servers natively
        const localIntroUrl = "./introvideo.mp4";
        const localDropInUrl = "./dropinvid.mp4";
        const localMirrorUrl = "./lookinthemirror.mp4";

        function launchVideoChain(playlistArray) {
            activeFilePlaylist = playlistArray;
            currentPlaylistIndex = 0;
            
            // Instantly clear background artwork elements out of view
            dropInTrigger.style.opacity = '0';
            dropInTrigger.style.pointerEvents = 'none';
            mirrorTrigger.style.opacity = '0';
            mirrorTrigger.style.pointerEvents = 'none';
            document.getElementById('dynamicDownload').style.opacity = '0';
            document.getElementById('dynamicDownload').style.pointerEvents = 'none';
            wallpaperBg.style.opacity = '0';
            
            // Bring player canvas forward out of the vault layer setup
            masterVideo.style.zIndex = "9999999"; 
            masterVideo.style.display = 'block';
            
            executePlaylistTrack();
        }

        function executePlaylistTrack() {
            if (currentPlaylistIndex < activeFilePlaylist.length) {
                masterVideo.src = activeFilePlaylist[currentPlaylistIndex];
                masterVideo.muted = false;
                masterVideo.load();
                
                const playPromise = masterVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(err => {
                        console.warn("Autoplay handler engaged safety muted loop:", err);
                        masterVideo.muted = true;
                        masterVideo.play().catch(e => console.error(e));
                    });
                }
            } else {
