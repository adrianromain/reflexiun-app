<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexiun</title>
    <style>
        /* BASE SETUP FOR THE ENTIRE MOBILE SCREEN */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. THE CRACKED GLASS BACKGROUND LAYER */
        /* Keeps your beautiful visual look identical, but makes it invisible to finger touches */
        .glass-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Keep your exact background image file path or URL below */
            background: url('background.jpg') no-repeat center center;
            background-size: cover;
            
            /* INVISIBLE FUNCTIONAL FIXES */
            z-index: 1 !important;          
            pointer-events: none !important;  /* Touches pass directly through the glass graphic */
        }

        /* 2. THE MAIN CONTAINER FOR LOGO AND LINKS */
        .main-content {
            position: relative;
            z-index: 1000 !important;       
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* THE GLOWING EMBLEM / LOGO SHAPE */
        .logo-shape {
            width: 180px;
            height: auto;
            margin-bottom: 20px;
        }

        /* THE "REFLEXIUN" MAIN BRAND TITLE */
        .brand-title {
            color: #ffffff;
            font-size: 38px;
            letter-spacing: 7px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        /* 3. THE NAVIGATION LINKS ("DROP IN", "LOOK IN THE MIRROR", "REFLECT") */
        /* They stay exactly where they are visually, but are forced to the top touch layer */
        .nav-link {
            display: block;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 30px 0;
            padding: 10px;
            font-weight: 300;
            
            /* INVISIBLE FUNCTIONAL FIXES */
            position: relative !important;
            z-index: 9999 !important;       /* Hard-locks the links above the glass image */
            pointer-events: auto !important; /* Forces the screen to register your clicks */
        }
    </style>
</head>
<body>

    <!-- 1. VISUAL BACKGROUND LAYER -->
    <div class="glass-background"></div>

    <!-- 2. FRONT WORKBENCH LAYER -->
    <div class="main-content">
        
        <!-- THE GLOWING ICON (Represented by the SVG code matching your screenshot) -->
        <svg class="logo-shape" viewBox="0 0 200 100" fill="none" xmlns="http://w3.org">
            <path d="M10 50 L100 15 L190 50 L100 85 Z" stroke="white" stroke-width="4"/>
            <path d="M40 50 Q100 100 160 50" stroke="white" stroke-width="4"/>
            <path d="M60 50 Q100 20 140 50" stroke="white" stroke-width="2"/>
        </svg>

        <h1 class="brand-title">Reflexiun</h1>
        
        <!-- 3. THE FULLY CLICKABLE NAVIGATION LINKS WITH DESTINATIONS -->
        <!-- Replace the URLs inside href="" with your real destination web addresses -->
        <a href="https://yourwebsite.com" class="nav-link">Drop In</a>
        
        <a href="https://yourwebsite.com" class="nav-link">Look In The Mirror</a>
        
        <a href="https://yourwebsite.com" class="nav-link">Reflect</a>
        
    </div>

</body>
</html>
