<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexiun</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: #000; width: 100%; height: 100%; overflow: hidden; }
        .full-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* The Background */
        .wallpaper-bg { background-image: url('reflexiunphone.png'); background-size: cover; background-position: center; z-index: 1; }
        
        /* Videos: 'contain' ensures no zooming/cropping */
        .vid-layer { z-index: 2; object-fit: contain; background: #000; opacity: 0; }
        #cameraStream { z-index: 3; transform: scaleX(-1); object-fit: contain; }
        
        .nav-menu { position: fixed; bottom: 20%; width: 100%; text-align: center; z-index: 10; }
        .nav-link { color: #fff; text-decoration: none; letter-spacing: 5px; text-transform: uppercase; display: block; margin: 20px 0; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="full-screen wallpaper-bg"></div>
    <video id="cameraStream" class="full-screen vid-layer" autoplay muted playsinline></video>
    <video id="masterVideo" class="full-screen vid-layer" playsinline></video>
    
    <div class="nav-menu" id="navMenu">
        <div id="dropIn" class="nav-link">drop in</div>
        <div id="mirror" class="nav-link">look in the mirror</div>
        <a href="reflexiunphone.png" class="nav-link" download>reflect</a>
    </div>

    <script>
        const cam = document.getElementById('cameraStream');
        const vid = document.getElementById('masterVideo');
        const nav = document.getElementById('navMenu');
        let activeRoute = "";

        function showNav(show) { nav.style.display = show ? 'block' : 'none'; }

        vid.onended = () => {
            if (vid.src.includes("introvideo.mp4")) {
                vid.src = (activeRoute === "mirror") ? "lookinthemirror.mp4" : "dropinvid.mp4";
                vid.play();
            } else {
                vid.style.opacity = '0';
                showNav(true);
            }
        };

        document.getElementById('dropIn').onclick = () => {
            activeRoute = "dropin";
            showNav(false);
            vid.src = "introvideo.mp4";
            vid.style.opacity = '1';
            vid.play();
        };

        document.getElementById('mirror').onclick = () => {
            activeRoute = "mirror";
            showNav(false);
            navigator.mediaDevices.getUserMedia({video: true}).then(s => {
                cam.srcObject = s;
                cam.style.opacity = '1';
                setTimeout(() => {
                    s.getTracks().forEach(t => t.stop());
                    cam.style.opacity = '0';
                    vid.src = "introvideo.mp4";
                    vid.style.opacity = '1';
                    vid.play();
                }, 4000);
            });
        };
    </script>
</body>
</html>
