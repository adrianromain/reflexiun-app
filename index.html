<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .wallpaper-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Keeps the exact width scale but shifts the entire image UP by 1 inch (96px) */
            object-position: center -96px; 
            z-index: 1;
        }
        .nav-menu-stack {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 400px;
            /* Shifted up to stay perfectly aligned relative to your lifted logo text */
            padding-top: 260px; 
            gap: 20px; 
        }
        .enter-link {
            color: #fff;
            text-decoration: none;
            font-size: 1.25rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer;
            font-weight: 400;
            display: inline-block;
        }

        @media (min-width: 1024px) {
            .nav-menu-stack {
                padding-top: 340px;
            }
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.2; text-shadow: 0 0 2px rgba(255,255,255,0.2); }
            15% { opacity: 1; text-shadow: 0 0 12px rgba(255,255,255,1), 0 0 20px rgba(255,255,255,0.8); }
            22% { opacity: 0.3; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            45% { opacity: 0.85; text-shadow: 0 0 14px rgba(255,255,255,0.9); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 8px rgba(255,255,255,0.6); }
            85% { opacity: 1; text-shadow: 0 0 14px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <img src="reflexiunbackground.png" alt="Reflexiun Background" class="wallpaper-bg">
        
        <div class="nav-menu-stack">
            <a href="#content" class="enter-link">drop in</a>
        </div>
    </div>

</body>
</html>
