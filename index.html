<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        /* Master Base Plane Container */
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #000;
        }
        .app-container.video-playing {
            animation: none !important;
        }
        
        /* Layer 1: Background Graphic */
        .wallpaper-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('reflexiunnewwallpaper.png');
            background-size: cover;
            background-position: center -144px;
            z-index: 1; 
            pointer-events: none !important; /* FIXED: Shield layer deactivated permanently */
            user-select: none;
            -webkit-user-drag: none;
            transition: opacity 0.5s ease;
        }
        .wallpaper-bg.fade-out {
            opacity: 0;
        }
        
        /* Layer 2: Master Native Video Layers */
        .movie-track-node {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
            display: none;
            z-index: 4;
            pointer-events: none !important; /* FIXED: Prevents media from blocking button input coordinates */
        }
        
        .camera-feed-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            transform: scaleX(-1);
            background-color: #000;
            display: none;
            pointer-events: none !important;
        }
        
        /* Layer 3: Interactive Menu Stack shifted up comfortably clear of logos */
        .nav-menu-stack {
            position: absolute; 
            bottom: 26%; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 10; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 400px;
            gap: 16px; /* Tight text line distribution footprint */
            pointer-events: auto !important; 
            transition: opacity 0.5s ease;
        }
        .nav-menu-stack.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        
        @media (min-width: 600px) and (max-width: 1023px) {
            .wallpaper-bg {
                background-image: url('reflexiuntablet.png'); 
                background-size: contain;
                background-position: center center;
            }
            .nav-menu-stack { bottom: 28%; }
        }
        @media (min-width: 1024px) {
            .wallpaper-bg {
                background-image: url('reflexiundesktop.png'); 
                background-size: contain;
                background-position: center center;
            }
            .nav-menu-stack { bottom: 30%; } 
        }

        /* Sleeker uniform font profile rules */
        .enter-link, .download-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem; 
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer; 
            font-weight: 300 !important; /* Thin typography style locked */
            display: inline-block !important; 
            padding: 8px 16px; 
            background: none;
            border: none;
            outline: none;
            pointer-events: auto !important;
        }

        .mirror-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%; 
            pointer-events: auto !important;
            height: 48px; 
        }
        
        /* Clean lighter reflection tracking coordinates */
        .mirror-reflection {
            transform: scaleY(-1);
            opacity: 0.08; /* Sharper bounce intensity signature */
            margin-top: -18px; 
            filter: blur(3px); 
            user-select: none;
            pointer-events: none !important;
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.25; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            15% { opacity: 1; text-shadow: 0 0 16px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.9); }
            22% { opacity: 0.35; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
            45% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 35px rgba(255,255,255,0.8); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 12px rgba(255,255,255,0.7); }
            85% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <div class="wallpaper-bg" id="wallpaperBg"></div>
        
        <!-- Native Player Layout Node Container -->
        <video id="masterVideoEngine" class="movie-track-node" autoplay muted playsinline webkit-playsinline crossorigin="anonymous" preload="auto"></video>
        <video id="cameraStream" class="camera-feed-stream" autoplay playsinline muted></video>

        <div class="nav-menu-stack" id="navMenuStack">
            <!-- 1. Drop In Route -->
            <div class="mirror-block">
                <a href="javascript:void(0);" id="dropInTrigger" class="enter-link">drop in</a>
                <span class="enter-link mirror-reflection">drop in</span>
            </div>
            
            <!-- 2. Look In The Mirror Route -->
            <div class="mirror-block">
                <a href="javascript:void(0);" id="mirrorTrigger" class="enter-link">look in the mirror</a>
                <span class="enter-link mirror-reflection">look in the mirror</span>
            </div>
            
            <!-- 3. Wallpaper Download Route -->
            <div class="mirror-block">
                <a href="javascript:void(0);" id="dynamicDownload" class="download-btn" download>reflect</a>
                <span class="download-btn mirror-reflection">reflect</span>
            </div>
        </div>

    </div>

            else if (width >= 600) { targetFile = 'reflexiuntablet.png'; }
            downloadLink.href = targetFile;
