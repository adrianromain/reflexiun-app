<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* --- PHONE SIZING (DEFAULT) --- */
        .wallpaper-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center -144px; /* Locked mobile height positioning */
            z-index: 1;
            pointer-events: none; 
            user-select: none;
            -webkit-user-drag: none;
        }
        .nav-menu-stack {
            position: relative;
            z-index: 10; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding-top: 210px; /* Locked mobile link positioning */
            gap: 20px;
            pointer-events: auto;
        }
        
        /* --- COMPUTER / DESKTOP SIZING OVERRIDES --- */
        @media (min-width: 1024px) {
            .wallpaper-bg {
                object-fit: contain;
                width: 100%;
                height: 100%;
                max-width: 100vw;
                max-height: 100vh; /* Restored back to full window footprint scaling */
                object-position: center center;
                transform: translateY(-40px); /* Direct vertical lift for laptop viewing layouts */
            }
            .nav-menu-stack {
                padding-top: 310px; /* Recalibrated spacing height separation rules */
            }
        }

        .enter-link {
            color: #fff;
            text-decoration: none;
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer;
            font-weight: 400;
            display: inline-block;
            padding: 10px 20px;
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.25; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            15% { opacity: 1; text-shadow: 0 0 16px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.9); }
            22% { opacity: 0.35; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
            45% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 35px rgba(255,255,255,0.8); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 12px rgba(255,255,255,0.7); }
            85% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <img src="reflexiunbackground.png" alt="Reflexiun Background" class="wallpaper-bg">
        
        <div class="nav-menu-stack">
            <a href="#content" class="enter-link">drop in</a>
        </div>
    </div>

</body>
</html>
