<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        /* THE MEDIA LAYER: Forced deep into the background underneath the text buttons */
        .media-vault {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000;
            z-index: 1 !important;
            pointer-events: none !important;
            user-select: none;
        }
        
        /* MOBILE VIEWPORT ARTWORK: Fixed to preserve your exact screenshot look */
        .wallpaper-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('reflexiunnewwallpaper.png');
            background-size: cover;
            background-position: center -220px; 
            z-index: 2 !important; 
            pointer-events: none !important; 
            transition: opacity 0.5s ease;
        }
        
        /* THE BUTTON LAYER: Isolated outside visual elements on the highest plane */
        .nav-menu-stack {
            position: fixed !important; 
            bottom: 12%; /* LOCKED: Keeps buttons exactly down where you love them */
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999 !important; /* Total dominance to block any hidden glass overlays */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 400px;
            gap: 16px; 
            pointer-events: auto !important; 
        }
        
        @media (min-width: 600px) and (max-width: 1023px) {
            .wallpaper-bg {
                background-position: center center;
            }
            .nav-menu-stack { bottom: 14%; }
        }
        
        @media (min-width: 1024px) {
            .wallpaper-bg {
                background-position: center center;
            }
            .nav-menu-stack { 
                bottom: 8% !important; 
            } 
            .nav-menu-stack .enter-link, 
            .nav-menu-stack .download-btn {
                font-size: 0.95rem !important; 
            }
        }

        .enter-link, .download-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem; 
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer; 
            font-weight: 300 !important; 
            display: inline-block !important; 
            padding: 8px 16px; 
            background: none;
            border: none;
            outline: none;
            pointer-events: auto !important; /* Forces the browser to read your clicks */
        }

        .mirror-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%; 
            height: auto !important;
            pointer-events: none !important;
        }
        
        /* CLEAN REFLECTION ARCHITECTURE FILTER CODE */
        .mirror-reflection {
            transform: scaleY(-1);
            opacity: 0.08; 
            margin-top: -18px; 
            filter: blur(3px); 
            user-select: none;
            pointer-events: none !important; /* Smashes the invisible text layout shield permanently */
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.25; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            15% { opacity: 1; text-shadow: 0 0 16px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.9); }
            22% { opacity: 0.35; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
            45% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 35px rgba(255,255,255,0.8); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 12px rgba(255,255,255,0.7); }
            85% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- Subterranean media vault holds background visuals completely out of touch way -->
        <div class="media-vault">
            <div class="wallpaper-bg" id="wallpaperBg"></div>
        </div>

        <!-- FIXED: Direct HTML link framework routes video files with absolute 100% mechanical un-blockable precision -->
        <div class="nav-menu-stack" id="navMenuStack">
            <div class="mirror-block">
                <a href="introvideo.mp4" id="dropInTrigger" class="enter-link">drop in</a>
                <span class="enter-link mirror-reflection">drop in</span>
            </div>
            
            <div class="mirror-block">
                <a href="lookinthemirror.mp4" id="mirrorTrigger" class="enter-link">look in the mirror</a>
                <span class="enter-link mirror-reflection">look in the mirror</span>
            </div>
            
            <div class="mirror-block">
                <a href="reflexiunnewwallpaper.png" id="dynamicDownload" class="download-btn" download>reflect</a>
                <span class="download-btn mirror-reflection">reflect</span>
            </div>
        </div>
    </div>

    <script>
        function configureAdaptiveDownload() {
            const downloadLink = document.getElementById('dynamicDownload');
            if (!downloadLink) return;
            const width = window.innerWidth;
            let targetFile = 'reflexiunnewwallpaper.png'; 
            if (width >= 1024) { targetFile = 'reflexiundesktop.png'; } 
            else if (width >= 600) { targetFile = 'reflexiuntablet.png'; }
            downloadLink.href = targetFile;
        }
        window.addEventListener('DOMContentLoaded', configureAdaptiveDownload);
        window.addEventListener('resize', configureAdaptiveDownload);
    </script>
</body>
</html>
