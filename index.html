<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexiun</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        p {
            color: #888888;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .video-box {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #111;
            border: 1px solid #222;
            margin-bottom: 30px;
            aspect-ratio: 16 / 9;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #e5e5e5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Reflexiun</h1>
        <p>A completely free mobile tool designed to smash cognitive traps, bypass internal blind spots, and shift your perspective.</p>
        
        <div class="video-box">
            <video autoplay loop muted playsinline>
                <source src="intro.mp4" type="video/mp4">
            </video>
        </div>

        <a href="#" class="btn">Drop In Now</a>
    </div>

</body>
</html>
