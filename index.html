<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            /* Failsafe: Standardizes background space if image has a glitch */
            background-image: url('reflexiunwallpaper.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40vh; /* Pushes text below center where logo sits */
        }
        .enter-link {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: randomGlow 3s infinite ease-in-out;
            cursor: pointer;
            font-weight: 300;
        }
        @keyframes randomGlow {
            0%, 100% { opacity: 0.2; text-shadow: 0 0 2px rgba(255,255,255,0.1); }
            10% { opacity: 1; text-shadow: 0 0 10px rgba(255,255,255,1), 0 0 20px rgba(255,255,255,0.6); }
            15% { opacity: 0.3; text-shadow: 0 0 3px rgba(255,255,255,0.2); }
            40% { opacity: 0.8; text-shadow: 0 0 12px rgba(255,255,255,0.9); }
            45% { opacity: 0.2; text-shadow: none; }
            70% { opacity: 0.9; text-shadow: 0 0 8px rgba(255,255,255,0.8); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Text with the specialized blinking glow script -->
        <a href="#content" class="enter-link">drop in</a>
    </div>

</body>
</html>
