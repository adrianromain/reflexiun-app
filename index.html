<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        /* THE MEDIA LAYER: Visual visual layers locked deep beneath active controls */
        .media-vault {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000;
            z-index: 1 !important;
            pointer-events: none !important;
            user-select: none;
        }
        
        /* MOBILE VIEWPORT ARTWORK: Fixed to preserve your exact screenshot look */
        .wallpaper-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('reflexiunnewwallpaper.png');
            background-size: cover;
            background-position: center -220px; 
            z-index: 2 !important; 
            pointer-events: none !important; 
            transition: opacity 0.5s ease;
        }
        
        /* THE IMMERSIVE WEB PLAYER STAGE: Naked, full-viewport dynamic scaling layer */
        .movie-track-node {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
            display: none;
            z-index: 4 !important;
            pointer-events: none !important; 
        }
        
        /* THE BUTTON LAYER: Isolated completely outside visual elements on the absolute peak plane */
        .nav-menu-stack {
            position: fixed !important; 
            bottom: 12%; /* LOCKED: Text remains stationary down where you love it on your phone */
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999 !important; /* Absolute numerical dominance over screen coordinates */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 400px;
            gap: 16px; 
            pointer-events: auto !important; 
        }
        
        @media (min-width: 600px) and (max-width: 1023px) {
            .wallpaper-bg {
                background-position: center center;
            }
            .nav-menu-stack { bottom: 14%; }
        }
        
        /* DESKTOP MONITOR BALANCE PANEL STYLES */
        @media (min-width: 1024px) {
            .wallpaper-bg {
                background-position: center center;
            }
            .nav-menu-stack { 
                bottom: 8% !important; /* Lowers link grid on large monitor displays */
            } 
            .nav-menu-stack .enter-link, 
            .nav-menu-stack .download-btn {
                font-size: 0.95rem !important; /* Shrinks typography sleeker on monitors */
            }
        }

        .enter-link, .download-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem; 
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer; 
            font-weight: 300 !important; 
            display: inline-block !important; 
            padding: 8px 16px; 
            background: none;
            border: none;
            outline: none;
            pointer-events: auto !important;
            z-index: 9999999 !important;
            position: relative;
        }

        .mirror-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%; 
            height: auto !important; /* Shrink-wraps links to delete container collisions */
            pointer-events: none !important; /* Ghost rows ensure zero touch masking */
        }
        
        /* CLEAN REFLECTION GLOW LIGHT SIGNATURE CODE */
        .mirror-reflection {
            transform: scaleY(-1);
            opacity: 0.08; /* Your exact reflection intensity signature match */
            margin-top: -18px; 
            filter: blur(3px); 
            user-select: none;
            pointer-events: none !important; /* Completely transparent to finger and mouse clicks */
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.25; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            15% { opacity: 1; text-shadow: 0 0 16px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.9); }
            22% { opacity: 0.35; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
            45% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 35px rgba(255,255,255,0.8); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 12px rgba(255,255,255,0.7); }
            85% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- Subterranean media vault holds visual layers completely out of the interface way -->
        <div class="media-vault">
            <div class="wallpaper-bg" id="wallpaperBg"></div>
            <!-- Immersive container player tag stripped completely free of browser controls -->
            <video id="masterVideoEngine" class="movie-track-node" playsinline webkit-playsinline crossorigin="anonymous" preload="auto" style="pointer-events: none !important;"></video>
        </div>

        <!-- High-priority button grid floats completely unmasked on top of the world -->
        <div class="nav-menu-stack" id="navMenuStack">
            <div class="mirror-block">
                <button id="dropInTrigger" class="enter-link">drop in</button>
                <span class="enter-link mirror-reflection">drop in</span>
            </div>
            
            <div class="mirror-block">
                <button id="mirrorTrigger" class="enter-link">look in the mirror</button>
                <span class="enter-link mirror-reflection">look in the mirror</span>
            </div>
            
            <div class="mirror-block">
                <a href="reflexiunnewwallpaper.png" id="dynamicDownload" class="download-btn" download>reflect</a>
                <span class="download-btn mirror-reflection">reflect</span>
            </div>
        </div>
    </div>

    <script>
        function configureAdaptiveDownload() {
            const downloadLink = document.getElementById('dynamicDownload');
            if (!downloadLink) return;
            const width = window.innerWidth;
            let targetFile = 'reflexiunnewwallpaper.png'; 
            if (width >= 1024) { targetFile = 'reflexiundesktop.png'; } 
            else if (width >= 600) { targetFile = 'reflexiuntablet.png'; }
            downloadLink.href = targetFile;
        }
        window.addEventListener('DOMContentLoaded', configureAdaptiveDownload);
        window.addEventListener('resize', configureAdaptiveDownload);

        const dropInTrigger = document.getElementById('dropInTrigger');
        const mirrorTrigger = document.getElementById('mirrorTrigger');
        const masterVideo = document.getElementById('masterVideoEngine');
        const wallpaperBg = document.getElementById('wallpaperBg');
        const navMenuStack = document.getElementById('navMenuStack');

        let selectedPathwayRoute = "dropin";

        // Pure folder directories containing your active local files
        const localIntroUrl = "introvideo.mp4";
        const localDropInUrl = "dropinvid.mp4";
        const localMirrorUrl = "lookinthemirror.mp4";

        function initializeImmersiveStream(targetVideoUrl, routeName) {
            selectedPathwayRoute = routeName;
            
            // Step 1 Defense: Clear the text menu cleanly out of the field of view
            navMenuStack.style.opacity = '0';
            navMenuStack.style.pointerEvents = 'none';
            wallpaperBg.style.opacity = '0';
            
            // Step 2 Defense: Force the naked video player to pop cleanly to the top layer floor
            masterVideo.style.zIndex = "9999999"; 
            masterVideo.src = targetVideoUrl;
            masterVideo.style.display = 'block';
            
            // Step 3 Defense: Command audio channels to unlock cleanly inside active human gesture context
            masterVideo.muted = false; 
            masterVideo.load();
            
            // Step 4 Defense: Promise tracking handles security policy audio locks automatically
            const playPromise = masterVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(err => {
                    console.warn("Muted safety catch fallback engaged:", err);
                    masterVideo.muted = true;
                    masterVideo.play().catch(e => console.error(e));
                });
            }
        }
        
        // Locked straightforward hardware click event receptors
        dropInTrigger.addEventListener('click', function() { initializeImmersiveStream(localIntroUrl, "dropin"); });
        mirrorTrigger.addEventListener('click', function() { initializeImmersiveStream(localIntroUrl, "mirror"); });

        // Step 5 Defense: Clear tracking strings using global '.includes' filters to destroy browser path crashes
        masterVideo.addEventListener('ended', () => {
