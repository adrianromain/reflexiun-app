<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: screenGlitchShake 8s infinite linear;
            transition: animation 0.3s ease;
        }
        .app-container.video-playing {
            animation: none !important;
        }
        
        /* Layer -100: Set to the absolute bottom floor to prevent click interference */
        .wallpaper-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('reflexiunnewwallpaper.png');
            background-size: cover;
            background-position: center -144px;
            z-index: -100 !important; 
            pointer-events: none !important; 
            user-select: none;
            -webkit-user-drag: none;
            transition: opacity 0.5s ease;
        }
        .wallpaper-bg.fade-out {
            opacity: 0;
        }
        
        /* Layer 10: Master Native Video Layers */
        .movie-track-node {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
            display: none;
        }
        #introVideoNode { z-index: 40; }
        #dropInVideoNode { z-index: 50; }
        
        .camera-feed-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 20;
            transform: scaleX(-1);
            background-color: #000;
            display: none;
            transition: opacity 2s linear;
        }
        #matrixFilterNode {
            z-index: 30;
            mix-blend-mode: screen; 
            pointer-events: none;
            transition: opacity 2s linear;
        }
        
        /* Layer 999999: Floating on the highest possible plane with zero graphics in its way */
        .nav-menu-stack {
            position: relative;
            z-index: 999999 !important; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding-top: 210px; 
            gap: 32px; 
            pointer-events: auto !important; 
            transition: opacity 0.5s ease;
        }
        .nav-menu-stack.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        @media (min-width: 600px) and (max-width: 1023px) {
            .wallpaper-bg {
                background-image: url('reflexiuntablet.png'); 
                background-size: contain;
                background-position: center center;
            }
            .nav-menu-stack {
                padding-top: 250px; 
            }
        }
        @media (min-width: 1024px) {
            .wallpaper-bg {
                background-image: url('reflexiundesktop.png'); 
                background-size: contain;
                background-position: center center;
            }
            .nav-menu-stack {
                padding-top: 380px; 
            }
        }

        .enter-link, .download-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer; 
            font-weight: 400;
            display: inline-block;
            padding: 10px 20px;
            background: none;
            border: none;
            outline: none;
            position: relative;
            z-index: 1000000 !important; /* Ultimate layer separation priority */
            pointer-events: auto !important;
        }

        /* --- THE DUAL MIRROR SETUP --- */
        .mirror-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 999999 !important;
            pointer-events: auto !important;
        }
        .mirror-reflection {
            transform: scaleY(-1);
            opacity: 0.02; 
            margin-top: -25px; 
            filter: blur(3px); 
            user-select: none;
            pointer-events: none !important;
        }

        @keyframes screenGlitchShake {
            0%, 92%, 100% { transform: translate(0, 0); }
            93% { transform: translate(-3px, 2px); }
            94% { transform: translate(2px, -2px); }
            95% { transform: translate(-2px, 3px); }
            96% { transform: translate(3px, -1px); }
            97% { transform: translate(0, 0); }
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.25; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            15% { opacity: 1; text-shadow: 0 0 16px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.9); }
            22% { opacity: 0.35; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
            45% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 35px rgba(255,255,255,0.8); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 12px rgba(255,255,255,0.7); }
            85% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <div class="wallpaper-bg" id="wallpaperBg"></div>

        <!-- Stable hardware video channels -->
        <video id="introVideoNode" class="movie-track-node" src="introvideo.mp4" playsinline webkit-playsinline preload="auto" muted></video>
        <video id="matrixFilterNode" class="movie-track-node" src="phonecode.mp4" playsinline webkit-playsinline preload="auto" loop muted></video>
        <video id="dropInVideoNode" class="movie-track-node" src="dropinvid.mp4" playsinline webkit-playsinline preload="auto" muted></video>
        <video id="cameraStream" class="camera-feed-stream" autoplay playsinline muted></video>
        
        <div class="nav-menu-stack" id="navMenuStack">
            <div class="mirror-block">
                <a href="#" id="dropInTrigger" class="enter-link">drop in</a>
                <span class="enter-link mirror-reflection">drop in</span>
            </div>
            
            <div class="mirror-block">
                <a href="#" id="dynamicDownload" class="download-btn" download>reflect</a>
                <span class="download-btn mirror-reflection">reflect</span>
            </div>
        </div>
    </div>
