<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        /* THE MEDIA LAYER: Forced deep into the background underneath the text buttons */
        .media-vault {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000;
            z-index: 1 !important;
            pointer-events: none !important;
            user-select: none;
        }
        
        /* Shared Baseline Rules for All Wallpaper Containers */
        .phone-bg, .tablet-bg, .desktop-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            z-index: 2 !important; 
            pointer-events: none !important; 
            transition: opacity 0.5s ease;
            display: none;
        }

        /* 1. PHONE BACKGROUND BOX (Screens up to 599px wide) */
        @media (max-width: 599px) {
            .phone-bg {
                display: block;
                background-image: url('reflexiunnewwallpaper.png');
                background-position: center center;
                transform: scale(1.1) translateY(-40px);
            }
            
            .enter-link, .download-btn {
                font-size: 0.55rem !important;
                padding: 0px !important;
            }

            .mirror-block {
                height: 24px !important;
            }

            .mirror-block .mirror-reflection {
                margin-top: -6px !important;
            }

            .nav-menu-stack {
                gap: 12px !important;
            }
        }

        /* 2. TABLET BACKGROUND BOX */
        @media (min-width: 600px) and (max-width: 1023px) {
            .tablet-bg {
                display: block;
                background-image: url('reflexiunnewwallpaper.png');
                background-position: center center;
            }
        }

        /* 3. DESKTOP BACKGROUND BOX */
        @media (min-width: 1024px) {
            .desktop-bg {
                display: block;
                background-image: url('reflexiunnewwallpaper.png');
                background-position: center center;
            }
        }
        
        .movie-track-node {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
            display: none;
            z-index: 3 !important;
            pointer-events: none !important; 
        }
        
        .nav-menu-stack {
            position: fixed !important; 
            bottom: 12%; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 400px;
            gap: 16px; 
            pointer-events: auto !important; 
        }
        
        @media (min-width: 600px) and (max-width: 1023px) {
            .nav-menu-stack { bottom: 14%; }
        }
        @media (min-width: 1024px) {
            .nav-menu-stack { bottom: 16%; } 
        }

        .enter-link, .download-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem; 
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer; 
            font-weight: 300 !important; 
            display: inline-block !important; 
            padding: 8px 16px; 
            background: none;
            border: none;
            outline: none;
            pointer-events: auto !important;
        }

        .mirror-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%; 
            pointer-events: auto !important;
            height: 48px; 
        }
        
        .mirror-reflection {
            transform: scaleY(-1);
            opacity: 0.08; 
            margin-top: -18px; 
            filter: blur(3px); 
            user-select: none;
            pointer-events: none !important;
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.25; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            15% { opacity: 1; text-shadow: 0 0 16px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.9); }
            22% { opacity: 0.35; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
            45% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 35px rgba(255,255,255,0.8); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 12px rgba(255,255,255,0.7); }
            85% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="media-vault">
        <div class="phone-bg" id="phoneBg"></div>
        <div class="tablet-bg" id="tabletBg"></div>
        <div class="desktop-bg" id="desktopBg"></div>
        
        <video id="masterVideoEngine" class="movie-track-node" autoplay playsinline webkit-playsinline preload="auto" style="pointer-events: none !important;"></video>
    </div>

    <div class="nav-menu-stack" id="navMenuStack">
        <div class="mirror-block">
            <button id="dropInTrigger" class="enter-link">drop in</button>
            <span class="enter-link mirror-reflection">drop in</span>
        </div>
        
        <div class="mirror-block">
            <button id="mirrorTrigger" class="enter-link">look in the mirror</button>
            <span class="enter-link mirror-reflection">look in the mirror</span>
        </div>
        
        <div class="mirror-block">
            <a href="reflexiunnewwallpaper.png" id="dynamicDownload" class="download-btn" download>reflect</a>
            <span class="download-btn mirror-reflection">reflect</span>
        </div>
    </div>

    <script>
        function configureAdaptiveDownload() {
            const downloadLink = document.getElementById('dynamicDownload');
            if (!downloadLink) return;
            const width = window.innerWidth;
            let targetFile = 'reflexiunnewwallpaper.png'; 
            if (width >= 1024) { targetFile = 'reflexiundesktop.png'; } 
            else if (width >= 600) { targetFile = 'reflexiuntablet.png'; }
            downloadLink.href = targetFile;
        }
        window.addEventListener('DOMContentLoaded', configureAdaptiveDownload);
        window.addEventListener('resize', configureAdaptiveDownload);

        const dropInTrigger = document.getElementById('dropInTrigger');
        const mirrorTrigger = document.getElementById('mirrorTrigger');
        const masterVideo = document.getElementById('masterVideoEngine');
        
        const phoneBg = document.getElementById('phoneBg');
        const tabletBg = document.getElementById('tabletBg');
        const desktopBg = document.getElementById('desktopBg');
        const navMenuStack = document.getElementById('navMenuStack');

        let selectedPathwayRoute = "dropin";

        const localIntroUrl = "introvideo.mp4";
        const localDropInUrl = "dropinvid.mp4";
        const localMirrorUrl = "mirrorvid.mp4";

        function startStreamingVideo(targetVideoUrl, routeName) {
            selectedPathwayRoute = routeName;
            navMenuStack.style.opacity = '0';
            navMenuStack.style.pointerEvents = 'none';
            
            if(phoneBg) phoneBg.style.opacity = '0';
            if(tabletBg) tabletBg.style.opacity = '0';
            if(desktopBg) desktopBg.style.opacity = '0';
            
            masterVideo.style.zIndex = "9999999"; 
            masterVideo.src = targetVideoUrl;
            masterVideo.style.display = 'block';
            
            masterVideo.muted = false;
            masterVideo.load();
            
            const playPromise = masterVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(err => {
                    console.log("Audio bypass fallback active.");
                    masterVideo.muted = true;
                    masterVideo.play().catch(e => console.error(e));
                });
            }
        }
        
        dropInTrigger.addEventListener('click', function() { startStreamingVideo(localIntroUrl, "dropin"); });
        mirrorTrigger.addEventListener('click', function() { startStreamingVideo(localIntroUrl, "mirror"); });

        masterVideo.addEventListener('ended', () => {
            const currentVideoSrc = masterVideo.src.toLowerCase();
            
            if (currentVideoSrc.includes("introvideo.mp4")) {
                // HARD RESET THE ENGINE: Force pause and clear current buffer before switching files
                masterVideo.pause();
                
                if (selectedPathwayRoute === "mirror") {
                    masterVideo.src = localMirrorUrl;
                } else {
                    masterVideo.src = localDropInUrl;
                }
                
                masterVideo.muted = false;
                masterVideo.load();
                
                const playPromise = masterVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(err => {
                        masterVideo.muted = true;
                        masterVideo.play().catch(e => console.error(e));
                    });
                }
            } else {
                masterVideo.style.zIndex = "3";
                masterVideo.style.display = 'none';
                masterVideo.src = "";
                navMenuStack.style.opacity = '1';
                navMenuStack.style.pointerEvents = 'auto';
                
                if(phoneBg) phoneBg.style.opacity = '1';
                if(tabletBg) tabletBg.style.opacity = '1';
                if(desktopBg) desktopBg.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
