<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        /* Root container that keeps the whole app aligned */
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* Layer 1: Background is locked in place and will never shift */
        .wallpaper-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            z-index: 1;
        }
        /* Layer 2: A rigid vertical stack for all current and future navigation links */
        .nav-menu-stack {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 400px;
            /* Pushes the starting point of the menu area safely below the logo emblem */
            padding-top: 360px; 
            gap: 20px; /* This sets the exact, permanent spacing between future links */
        }
        .enter-link {
            color: #fff;
            text-decoration: none;
            font-size: 1.25rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer;
            font-weight: 400;
            display: inline-block;
        }

        /* Adjusts the menu starting position proportionally for desktop computer layouts */
        @media (min-width: 1024px) {
            .nav-menu-stack {
                padding-top: 440px;
            }
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.2; text-shadow: 0 0 2px rgba(255,255,255,0.2); }
            15% { opacity: 1; text-shadow: 0 0 12px rgba(255,255,255,1), 0 0 20px rgba(255,255,255,0.8); }
            22% { opacity: 0.3; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            45% { opacity: 0.85; text-shadow: 0 0 14px rgba(255,255,255,0.9); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 8px rgba(255,255,255,0.6); }
            85% { opacity: 1; text-shadow: 0 0 14px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Background Layer -->
        <img src="reflexiunbackground.png" alt="Reflexiun Background" class="wallpaper-bg">
        
        <!-- Navigation Menu Layer (Ready for expanding deep functionality) -->
        <div class="nav-menu-stack">
            <a href="#content" class="enter-link">drop in</a>
            <!-- New paths and navigation routes will slide directly under here safely -->
        </div>
    </div>

</body>
</html>
