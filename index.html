<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexiun</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        .vault { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .bg { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('reflexiunnewwallpaper.png') center/cover no-repeat;
            z-index: 2;
        }
        .vid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 5; }
        #cam { z-index: 10; transform: scaleX(-1); }
        #filter { z-index: 15; mix-blend-mode: screen; }
        .nav { 
            position: fixed; bottom: 10%; width: 100%; z-index: 20; 
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        button { color: #fff; background: none; border: 1px solid #fff; padding: 10px 20px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="vault">
        <div id="bg" class="bg"></div>
        <video id="intro" class="vid" src="introvideo.mp4" playsinline></video>
        <video id="drop" class="vid" src="dropinvid.mp4" playsinline></video>
        <video id="mirror" class="vid" src="lookinthemirror.mp4" playsinline></video>
        <video id="cam" class="vid" autoplay playsinline muted></video>
        <video id="filter" class="vid" src="phonecode.mp4" loop playsinline muted></video>
    </div>

    <div class="nav" id="nav">
        <button onclick="start('drop')">drop in</button>
        <button onclick="start('mirror')">look in the mirror</button>
    </div>

    <script>
        const nav = document.getElementById('nav');
        const intro = document.getElementById('intro');
        const cam = document.getElementById('cam');
        const filter = document.getElementById('filter');
        const drop = document.getElementById('drop');
        const mirror = document.getElementById('mirror');
        let choice = "";

        async function start(type) {
            choice = type;
            nav.style.display = 'none';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                cam.srcObject = stream;
            } catch(e) { console.error(e); }
            intro.style.display = 'block';
            intro.play();
        }

        intro.onended = () => {
            intro.style.display = 'none';
            cam.style.display = 'block';
            filter.style.display = 'block';
            filter.play();
            setTimeout(() => {
                cam.style.display = 'none';
                filter.style.display = 'none';
                if(cam.srcObject) cam.srcObject.getTracks().forEach(t => t.stop());
                const active = (choice === 'mirror') ? mirror : drop;
                active.style.display = 'block';
                active.play();
                active.onended = () => { active.style.display = 'none'; nav.style.display = 'flex'; };
            }, 4000);
        };
    </script>
</body>
</html>
