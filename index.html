<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        .media-vault {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000;
            z-index: 1 !important;
            pointer-events: none !important;
            user-select: none;
        }
        
        .phone-bg, .tablet-bg, .desktop-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            z-index: 2 !important; 
            pointer-events: none !important; 
            transition: opacity 0.5s ease;
            display: none;
        }

        @media (max-width: 599px) {
            .phone-bg {
                display: block;
                background-image: url('reflexiunnewwallpaper.png');
                background-position: center center;
                transform: scale(1.1) translateY(-40px);
            }
            .enter-link, .download-btn { font-size: 0.55rem !important; padding: 0px !important; }
            .mirror-block { height: 24px !important; }
            .mirror-block .mirror-reflection { margin-top: -6px !important; }
            .nav-menu-stack { gap: 12px !important; }
        }

        @media (min-width: 600px) and (max-width: 1023px) {
            .tablet-bg { display: block; background-image: url('reflexiunnewwallpaper.png'); background-position: center center; }
        }

        @media (min-width: 1024px) {
            .desktop-bg { display: block; background-image: url('reflexiunnewwallpaper.png'); background-position: center center; }
        }
        
        .movie-track-node {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
            display: none;
            pointer-events: none !important; 
        }

        #introPlayer { z-index: 100 !important; }
        #dropInPlayer { z-index: 90 !important; }
        #mirrorPlayer { z-index: 80 !important; }

        #cameraMirror {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 200 !important; 
            transform: scaleX(-1); 
            pointer-events: none !important;
        }

        /* MATRIX CODE FILTER OVERLAY LAYER WITH TRANSPARENT BLENDING */
        #phoneOverlayFilter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 999999 !important; 
            pointer-events: none !important;
            background: transparent;
            
            /* Drops out the solid black background from phonecode.mp4 so the lens shows through */
            mix-blend-mode: screen; 
        }
        
        .nav-menu-stack {
            position: fixed !important; 
            bottom: 12%; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999999 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 400px;
            gap: 16px; 
            pointer-events: auto !important; 
            transition: opacity 0.4s ease;
        }
        
        @media (min-width: 600px) and (max-width: 1023px) { .nav-menu-stack { bottom: 14%; } }
        @media (min-width: 1024px) { .nav-menu-stack { bottom: 16%; } }

        .enter-link, .download-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem; 
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer; 
            font-weight: 300 !important; 
            display: inline-block !important; 
            padding: 8px 16px; 
            background: none;
            border: none;
            outline: none;
            pointer-events: auto !important;
        }

        .mirror-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%; 
            pointer-events: auto !important;
            height: 48px; 
        }
        
        .mirror-reflection {
            transform: scaleY(-1);
            opacity: 0.08; 
            margin-top: -18px; 
            filter: blur(3px); 
            user-select: none;
            pointer-events: none !important;
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.25; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            15% { opacity: 1; text-shadow: 0 0 16px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.9); }
            22% { opacity: 0.35; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
            45% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 35px rgba(255,255,255,0.8); }
            50% { opacity: 0.15;
