<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexiun</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('reflexiunphone.png') center/cover no-repeat; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; background: #000; }
        #nav { position: fixed; bottom: 20%; width: 100%; text-align: center; }
        .link { color: white; cursor: pointer; display: block; margin: 20px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <video id="cam" playsinline muted></video>
    <video id="vid" playsinline></video>
    
    <div id="nav">
        <div class="link" onclick="playFlow('drop')">drop in</div>
        <div class="link" onclick="playFlow('mirror')">look in the mirror</div>
        <a class="link" href="reflexiunphone.png" download>reflect</a>
    </div>

    <script>
        const cam = document.getElementById('cam');
        const vid = document.getElementById('vid');
        const nav = document.getElementById('nav');

        function playFlow(type) {
            nav.style.display = 'none';
            if (type === 'mirror') {
                navigator.mediaDevices.getUserMedia({video: true}).then(s => {
                    cam.srcObject = s;
                    cam.style.display = 'block';
                    setTimeout(() => {
                        s.getTracks().forEach(t => t.stop());
                        cam.style.display = 'none';
                        vid.src = 'lookinthemirror.mp4';
                        vid.style.display = 'block';
                        vid.play();
                    }, 4000);
                });
            } else {
                vid.src = 'dropinvid.mp4';
                vid.style.display = 'block';
                vid.play();
            }
        }

        vid.onended = () => {
            vid.style.display = 'none';
            nav.style.display = 'block';
        };
    </script>
</body>
</html>
