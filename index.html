<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reflexiun</title>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('reflexiunphone.png') center/cover no-repeat; }
        
        /* Video layers */
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; background: #000; }
        
        /* Mirroring effect ONLY on camera */
        #cam { transform: scaleX(-1); }
        
        #nav { position: fixed; bottom: 100px; width: 100%; text-align: center; }
        .link { color: white; cursor: pointer; display: block; margin: 30px 0; font-size: 16px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <video id="cam" playsinline muted></video>
    <video id="vid" playsinline></video>
    
    <div id="nav">
        <div class="link" onclick="start('drop')">drop in</div>
        <div class="link" onclick="start('mirror')">look in the mirror</div>
        <a class="link" href="reflexiunphone.png" download>reflect</a>
    </div>

    <script>
        const cam = document.getElementById('cam');
        const vid = document.getElementById('vid');
        const nav = document.getElementById('nav');
        let mode = "";

        function start(type) {
            mode = type;
            nav.style.display = 'none';
            // Start with the Intro
            vid.src = 'introvideo.mp4';
            vid.style.display = 'block';
            vid.play();
        }

        vid.onended = () => {
            // After intro, decide what to do
            if (vid.src.includes('introvideo.mp4')) {
                if (mode === 'mirror') {
                    // Start Camera
                    vid.style.display = 'none';
                    navigator.mediaDevices.getUserMedia({video: true}).then(s => {
                        cam.srcObject = s;
                        cam.style.display = 'block';
                        setTimeout(() => {
                            s.getTracks().forEach(t => t.stop());
                            cam.style.display = 'none';
                            // Play final mirror video
                            vid.src = 'lookinthemirror.mp4';
                            vid.style.display = 'block';
                            vid.play();
                        }, 4000);
                    });
                } else {
                    // Drop in flow
                    vid.src = 'dropinvid.mp4';
                    vid.play();
                }
            } else {
                // Final video finished
                vid.style.display = 'none';
                nav.style.display = 'block';
            }
        };
    </script>
</body>
</html>
