<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: screenGlitchShake 8s infinite linear;
        }
        
        /* --- 1. MOBILE PHONE BACKGROUND (DEFAULT) --- */
        .wallpaper-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center -144px;
            z-index: 1;
            pointer-events: none; 
            user-select: none;
            -webkit-user-drag: none;
            content: url('reflexiunnewwallpaper.png');
        }
        
        .nav-menu-stack {
            position: relative;
            z-index: 10; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding-top: 210px;
            gap: 24px; /* Structured gap separation between menu targets */
            pointer-events: auto;
        }
        
        /* --- 2. TABLET / IPAD DEVICE OVERRIDES --- */
        @media (min-width: 600px) and (max-width: 1023px) {
            .wallpaper-bg {
                content: url('reflexiuntablet.png'); 
                object-fit: contain;
                width: 100%;
                height: 100%;
                object-position: center center;
                margin-top: -30px; 
            }
            .nav-menu-stack {
                padding-top: 250px; 
            }
        }
        
        /* --- 3. DESKTOP / LAPTOP MONITOR OVERRIDES --- */
        @media (min-width: 1024px) {
            .wallpaper-bg {
                content: url('reflexiundesktop.png'); 
                object-fit: contain;
                width: 100%;
                height: 100%;
                max-width: 100vw;
                max-height: 100vh;
                object-position: center center;
                margin-top: -40px; 
            }
            .nav-menu-stack {
                padding-top: 310px; 
            }
        }

        /* Standardized Action Buttons Style Rules */
        .enter-link, .download-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer;
            font-weight: 400;
            display: inline-block;
            padding: 10px 20px;
            background: none;
            border: none;
            outline: none;
        }

        /* --- THE MIRROR DESIGN EFFECT --- */
        .mirror-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        /* Generates a ghosted, inverted reflection beneath the download text link */
        .mirror-reflection {
            transform: scaleY(-1);
            opacity: 0.15;
            margin-top: -8px;
            filter: blur(1px);
            user-select: none;
            pointer-events: none;
        }

        @keyframes screenGlitchShake {
            0%, 92%, 100% { transform: translate(0, 0); }
            93% { transform: translate(-3px, 2px); }
            94% { transform: translate(2px, -2px); }
            95% { transform: translate(-2px, 3px); }
            96% { transform: translate(3px, -1px); }
            97% { transform: translate(0, 0); }
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.25; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            15% { opacity: 1; text-shadow: 0 0 16px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.9); }
            22% { opacity: 0.35; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
            45% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 35px rgba(255,255,255,0.8); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 12px rgba(255,255,255,0.7); }
            85% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <img class="wallpaper-bg" alt="Reflexiun Adaptive Framework">
        
        <div class="nav-menu-stack">
            <!-- First Tier Route -->
            <a href="#content" class="enter-link">drop in</a>
            
            <!-- Second Tier Route: Auto-detecting Mirror Block Container -->
            <div class="mirror-block">
                <a href="#" id="dynamicDownload" class="download-btn" download>get asset</a>
                <span class="download-btn mirror-reflection">get asset</span>
            </div>
        </div>
    </div>

    <!-- Intelligent client-side adaptive engine layout script -->
    <script>
        function configureAdaptiveDownload() {
            const downloadLink = document.getElementById('dynamicDownload');
            if (!downloadLink) return;

            const width = window.innerWidth;
            let targetFile = 'reflexiunnewwallpaper.png'; // Fallback Base Sizing Asset

            if (width >= 1024) {
                targetFile = 'reflexiundesktop.png'; // Desktop computer assets
            } else if (width >= 600) {
                targetFile = 'reflexiuntablet.png'; // Intermediate tablet assets
            }

            downloadLink.href = targetFile;
        }

        // Run detection loops instantly upon viewport initialization routines
        window.addEventListener('DOMContentLoaded', configureAdaptiveDownload);
        window.addEventListener('resize', configureAdaptiveDownload);
    </script>

</body>
</html>
