<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflexiun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        /* THE VISUAL FRAMEWORK ARCHITECTURE */
        .media-vault {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000;
            z-index: 1 !important;
            pointer-events: none !important;
            user-select: none;
        }
        
        .phone-bg, .tablet-bg, .desktop-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            z-index: 2 !important; 
            pointer-events: none !important; 
            transition: opacity 0.5s ease;
            display: none;
        }

        @media (max-width: 599px) {
            .phone-bg {
                display: block;
                background-image: url('reflexiunnewwallpaper.png');
                background-position: center center;
                transform: scale(1.1) translateY(-40px);
            }
            .enter-link, .download-btn { font-size: 0.55rem !important; padding: 0px !important; }
            .mirror-block { height: 24px !important; }
            .mirror-block .mirror-reflection { margin-top: -6px !important; }
            .nav-menu-stack { gap: 12px !important; }
        }

        @media (min-width: 600px) and (max-width: 1023px) {
            .tablet-bg { display: block; background-image: url('reflexiunnewwallpaper.png'); background-position: center center; }
        }

        @media (min-width: 1024px) {
            .desktop-bg { display: block; background-image: url('reflexiunnewwallpaper.png'); background-position: center center; }
        }
        
        /* TRIPLE ENGINE CORE PLATFORM LAYER */
        .movie-track-node {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
            display: none;
            pointer-events: none !important; 
        }

        #introPlayer { z-index: 100 !important; }
        #dropInPlayer { z-index: 90 !important; }
        #mirrorPlayer { z-index: 80 !important; }

        /* LIVE SELF MATRIX MIRROR LAYER */
        #cameraMirror {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 200 !important; /* Positions above video engines */
            transform: scaleX(-1); /* Flips front-facing optics to look natural */
            pointer-events: none !important;
        }

        /* LIVE REPOSITORY CODE GRAPHIC OVERLAY FILTER */
        #phoneOverlayFilter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('codefile.png'); /* References your repository image asset */
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            display: none;
            z-index: 210 !important; /* Layers directly over the live hardware matrix stream */
            pointer-events: none !important;
        }
        
        /* USER SELECTION LINK PANEL */
        .nav-menu-stack {
            position: fixed !important; 
            bottom: 12%; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 400px;
            gap: 16px; 
            pointer-events: auto !important; 
            transition: opacity 0.4s ease;
        }
        
        @media (min-width: 600px) and (max-width: 1023px) { .nav-menu-stack { bottom: 14%; } }
        @media (min-width: 1024px) { .nav-menu-stack { bottom: 16%; } }

        .enter-link, .download-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem; 
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: randomGlow 3.5s infinite ease-in-out;
            cursor: pointer; 
            font-weight: 300 !important; 
            display: inline-block !important; 
            padding: 8px 16px; 
            background: none;
            border: none;
            outline: none;
            pointer-events: auto !important;
        }

        .mirror-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%; 
            pointer-events: auto !important;
            height: 48px; 
        }
        
        .mirror-reflection {
            transform: scaleY(-1);
            opacity: 0.08; 
            margin-top: -18px; 
            filter: blur(3px); 
            user-select: none;
            pointer-events: none !important;
        }

        @keyframes randomGlow {
            0%, 100% { opacity: 0.25; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
            15% { opacity: 1; text-shadow: 0 0 16px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.9); }
            22% { opacity: 0.35; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
            45% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 35px rgba(255,255,255,0.8); }
            50% { opacity: 0.15; text-shadow: none; }
            70% { opacity: 0.75; text-shadow: 0 0 12px rgba(255,255,255,0.7); }
            85% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,1); }
        }
    </style>
</head>
<body>

    <div class="media-vault">
        <div class="phone-bg" id="phoneBg"></div>
        <div class="tablet-bg" id="tabletBg"></div>
        <div class="desktop-bg" id="desktopBg"></div>
        
        <video id="introPlayer" class="movie-track-node" src="introvideo.mp4" playsinline webkit-playsinline preload="auto"></video>
        <video id="dropInPlayer" class="movie-track-node" src="dropinvid.mp4" playsinline webkit-playsinline preload="auto"></video>
        <video id="mirrorPlayer" class="movie-track-node" src="mirrorvid.mp4" playsinline webkit-playsinline preload="auto"></video>
        
        <video id="cameraMirror" autoplay playsinline muted></video>
        
        <div id="phoneOverlayFilter"></div>
    </div>

    <div class="nav-menu-stack" id="navMenuStack">
        <div class="mirror-block">
            <button id="dropInTrigger" class="enter-link">drop in</button>
            <span class="enter-link mirror-reflection">drop in</span>
        </div>
        
        <div class="mirror-block">
            <button id="mirrorTrigger" class="enter-link">look in the mirror</button>
            <span class="enter-link mirror-reflection">look in the mirror</span>
        </div>
        
        <div class="mirror-block">
            <a href="reflexiunnewwallpaper.png" id="dynamicDownload" class="download-btn" download>reflect</a>
            <span class="download-btn mirror-reflection">reflect</span>
        </div>
    </div>

    <script>
        function configureAdaptiveDownload() {
            const downloadLink = document.getElementById('dynamicDownload');
            if (!downloadLink) return;
            const width = window.innerWidth;
            let targetFile = 'reflexiunnewwallpaper.png'; 
            if (width >= 1024) { targetFile = 'reflexiundesktop.png'; } 
            else if (width >= 600) { targetFile = 'reflexiuntablet.png'; }
            downloadLink.href = targetFile;
        }
        window.addEventListener('DOMContentLoaded', configureAdaptiveDownload);
        window.addEventListener('resize', configureAdaptiveDownload);

        const dropInTrigger = document.getElementById('dropInTrigger');
        const mirrorTrigger = document.getElementById('mirrorTrigger');
        
        const introPlayer = document.getElementById('introPlayer');
        const dropInPlayer = document.getElementById('dropInPlayer');
        const mirrorPlayer = document.getElementById('mirrorPlayer');
        
        const cameraMirror = document.getElementById('cameraMirror');
        const phoneOverlayFilter = document.getElementById('phoneOverlayFilter');
        
        const phoneBg = document.getElementById('phoneBg');
        const tabletBg = document.getElementById('tabletBg');
        const desktopBg = document.getElementById('desktopBg');
        const navMenuStack = document.getElementById('navMenuStack');

        let selectedPathwayRoute = "dropin";
        let activeCameraStream = null;
        let cameraPermissionGranted = false;

        function runSystemSequence(routeName) {
            selectedPathwayRoute = routeName;
            
            // Clear baseline navigation frames out immediately
            navMenuStack.style.opacity = '0';
            navMenuStack.style.pointerEvents = 'none';
            if(phoneBg) phoneBg.style.opacity = '0';
            if(tabletBg) tabletBg.style.opacity = '0';
            if(desktopBg) desktopBg.style.opacity = '0';
            
            // Unmute and fire the intro track inside the user interaction click window
            introPlayer.style.display = 'block';
            introPlayer.muted = false;
            introPlayer.play().catch(err => {
                introPlayer.muted = true;
                introPlayer.play().catch(e => console.error(e));
            });

            // REQUEST NATIVE HARDWARE CAM ENGINE TO PREPARE PIPELINE
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                })
                .then(stream => {
                    activeCameraStream = stream;
                    cameraPermissionGranted = true;
                    cameraMirror.srcObject = stream;
                })
                .catch(error => {
                    console.log("Hardware request denied. Experience failsafe authorized.");
                    cameraPermissionGranted = false;
                });
            }
        }
        
        dropInTrigger.addEventListener('click', function() { runSystemSequence("dropin"); });
        mirrorTrigger.addEventListener('click', function() { runSystemSequence("mirror"); });

        // FIRES IMMEDIATELY WHEN THE INTRO MOVIE TERMINATES
        introPlayer.addEventListener('ended', () => {
            introPlayer.style.display = 'none';
            
            if (cameraPermissionGranted && activeCameraStream) {
                // RUN ACCESSIBLE MATRIX MIRROR BLOCK
                cameraMirror.style.display = 'block';
                phoneOverlayFilter.style.display = 'block'; // Drops codefile.png filter over the screen
                
                // 4 SECOND LIVE TRACK COUNTDOWN TIMER
                setTimeout(() => {
                    cameraMirror.style.display = 'none';
                    phoneOverlayFilter.style.display = 'none';
                    
                    if(activeCameraStream) {
                        activeCameraStream.getTracks().forEach(track => track.stop());
                    }
                    
                    launchSecondaryPathTrack();
                }, 4000);
                
            } else {
                // CRITICAL FAILSAFE ROUTE: Bypasses mirror block if hardware permission was denied
                launchSecondaryPathTrack();
            }
        });

        function launchSecondaryPathTrack() {
            if (selectedPathwayRoute === "mirror") {
                mirrorPlayer.style.display = 'block';
                mirrorPlayer.muted = false;
                mirrorPlayer.play().catch(e => handleTrackEndReset());
                mirrorPlayer.addEventListener('ended', handleTrackEndReset);
            } else {
                dropInPlayer.style.display = 'block';
                dropInPlayer.muted = false;
                dropInPlayer.play().catch(e => handleTrackEndReset());
                dropInPlayer.addEventListener('ended', handleTrackEndReset);
            }
        }

        // COMPLETE SYSTEM RESET AND RETURN HOME LOOP
        function handleTrackEndReset() {
            dropInPlayer.style.display = 'none';
            mirrorPlayer.style.display = 'none';
            
            activeCameraStream = null;
            cameraPermissionGranted = false;
            
            // Restore interface elements to base layout settings
            navMenuStack.style.opacity = '1';
            navMenuStack.style.pointerEvents = 'auto';
            if(phoneBg) phoneBg.style.opacity = '1';
            if(tabletBg) tabletBg.style.opacity = '1';
            if(desktopBg) desktopBg.style.opacity = '1';
        }
    </script>
</body>
</html>
